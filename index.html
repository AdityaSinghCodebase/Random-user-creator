<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random User Generator</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="hero">
      <h3>See some Random Person</h3>
      <div class="profile-card">
        <div class="profile-img">
          <img id="profile-img" src="" alt="profile img" />
        </div>
        <div class="profile-details">
          <span id="profile-gender">Gender</span>
          <h3 id="">
            <span id="profile-title">Title</span>
            <span id="profile-firstName">First Name</span>
            <span id="profile-lastName">Last Name</span>
          </h3>
          <p id="profile-age">43</p>
          <p id="profile-email">email</p>
          <p id="profile-cell">985-589-956</p>
          <p id="profile-location-country">India</p>
          <p id="profile-location-city">Indore</p>
        </div>
      </div>
      <button id="reload-user" class="btn">New User</button>
    </div>
  </body>
</html>
